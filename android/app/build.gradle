plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.geminiweb2api'
    compileSdk 34

    defaultConfig {
        applicationId "com.geminiweb2api"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.1.0"

        // Python 3.12 on Chaquopy is 64-bit only: real devices + emulator.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK can be installed directly
            // by sideloading. This project is not intended for Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "python3"
        pip {
            install "httpx"
        }
    }
    productFlavors { }
    sourceSets { }
}
